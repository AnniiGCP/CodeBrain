name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Tests & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run full regression and security test suites
        working-directory: backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./test_app.db
          SESSION_SECRET: test-session-secret-for-ci-runs-32-chars-minimum
          ALLOW_DEV_LOGIN: "false"
        run: |
          python -m pytest --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/pytest-results.xml

  frontend-checks:
    name: Frontend Lint, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint linter
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit & rendering tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run TypeScript type-check and Vite production build
        working-directory: frontend
        env:
          VITE_API_URL: https://codebrain-backend.onrender.com
        run: npm run build
